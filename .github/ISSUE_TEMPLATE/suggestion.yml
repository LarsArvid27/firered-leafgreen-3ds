name: Suggestion
description: An idea to make FireRed 3DS or LeafGreen 3DS better.
title: "[Idea] "
labels: ["suggestion"]
body:
  - type: input
    id: game
    attributes:
      label: Game
      description: FireRed, LeafGreen or both
      placeholder: Both
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
